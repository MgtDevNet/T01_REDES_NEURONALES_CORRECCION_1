; ============================================================================
; config.ini — Parámetros del punto 2.2 (TSP con costos reales, ACO y GA)
; ============================================================================
; Edita los valores y ejecuta:   python3 src/tsp_espana.py
; No hace falta tocar el código.
;
; Reglas del formato:
;   - Una línea por parámetro:  nombre = valor
;   - Lo que va después de ";" es un comentario y se ignora.
;   - Decimales con punto (0.5).
;   - Sí/no:  si | no
;   - Si borras una línea, se usa el valor por defecto indicado entre corchetes.
;
; Prioridad:  opciones de terminal (--seed, --valor-hora...)  >  este archivo  >  por defecto
; ============================================================================

[general]
algoritmo = both            ; [both]  aco | ga | both
semilla = 20261008          ; [20261008]  Misma semilla => mismo resultado.
inicio = Madrid             ; [Madrid]  Ciudad desde la que se MUESTRA el recorrido
                            ;           (el ciclo y su costo no cambian).
generar_gif = si            ; [si]  no = más rápido (los GIF tardan unos segundos cada uno)
verificar_exacto = si       ; [si]  compara con el óptimo exacto (programación lineal entera)
modo = hibrido              ; [hibrido]  hibrido = con búsqueda local (2-opt + Or-opt): llega al óptimo
                            ;            puro    = ACO y GA clásicos (aplica la sección [puro])
resultados = results        ; [results]  carpeta de salida: results/hibrido o results/puro

; ----------------------------------------------------------------------------
[costos]
; Para cada par de capitales:  costo = min(con peaje, sin peaje) de
;     valor_hora × horas  +  km × consumo/100 × precio_combustible  +  peaje
valor_hora = 26.18          ; [26.18]  €/h (INE, coste laboral por hora, 2T 2026)
precio_combustible = 1.799  ; [1.799]  €/L (gasolina 95, 5-oct-2026)
consumo_l_100km = 4.7       ; [4.7]    Toyota Corolla Hybrid 140H (WLTP)

; ----------------------------------------------------------------------------
[aco]
; Colonia de hormigas (Ant System elitista, de punto_2/parte_1/tsp_bio.py)
n_hormigas = 20             ; [20]   Hormigas por iteración.
iteraciones = 200           ; [200]  Ciclos de construcción + actualización de feromona.
alpha = 1.0                 ; [1.0]  Peso de la feromona (memoria colectiva).
beta = 3.0                  ; [3.0]  Peso del costo del tramo (1/c). Alto = más voraz.
rho = 0.1                   ; [0.1]  Evaporación (0 < rho <= 1). Alto = olvida rápido.
elitismo = 5.0              ; [5.0]  Refuerzo extra de la mejor ruta global (0 = sin elitismo).
busqueda_local = si         ; [si]   2-opt + Or-opt a la mejor hormiga de cada iteración.

; ----------------------------------------------------------------------------
[ga]
; Algoritmo genético (memético si p_busqueda_local > 0)
tam_poblacion = 150         ; [150]  Número de rutas en la población.
generaciones = 300          ; [300]  Número de generaciones.
p_cruce = 0.9               ; [0.9]  Probabilidad de cruce OX.
p_mutacion = 0.3            ; [0.3]  Probabilidad de mutación por inversión.
p_busqueda_local = 0.05     ; [0.05] Fracción de hijos pulidos con 2-opt + Or-opt (0 = GA clásico).
n_elite = 2                 ; [2]    Mejores rutas que pasan intactas a la siguiente generación.
k_torneo = 3                ; [3]    Tamaño del torneo. Alto = más presión selectiva.

; ----------------------------------------------------------------------------
[puro]
; Solo con  modo = puro  (o  --modo puro): ACO y GA sin búsqueda local.
aco_n_hormigas = 47         ; [47]   una hormiga por ciudad
aco_iteraciones = 300       ; [300]
ga_generaciones = 1500      ; [1500]

; ----------------------------------------------------------------------------
[sensibilidad]
; Barrido del valor de la hora:  python3 src/sensibilidad.py
vh_min = 0                  ; [0]    €/h
vh_max = 100                ; [100]  €/h
vh_paso = 1                 ; [1]    €/h
